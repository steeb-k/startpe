name: cargo-deny

on:
  push:
    branches: [master]
  pull_request:
  # Advisories get published against code that has not changed, so a scheduled
  # run is the only thing that catches a newly-disclosed vulnerability in a
  # dependency we already had.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    # The helpers are separate workspaces with their own lockfiles, so each one
    # needs its own cargo-deny run — the root manifest does not reach them.
    name: cargo-deny (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - helpers/network-gtk/Cargo.toml
          - helpers/run-gtk/Cargo.toml
          - helpers/settings-gtk/Cargo.toml
          - helpers/start-menu-gtk/Cargo.toml
          - helpers/sysinfo-gtk/Cargo.toml
    steps:
      # Actions are pinned by commit SHA rather than tag: a tag can be moved to
      # point at different code, which is the same substitution risk this
      # workflow exists to catch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""
          manifest-path: ${{ matrix.manifest }}
